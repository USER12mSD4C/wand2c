name = "Wand"
grammar = "c"
path_suffixes = ["w", "wh"]
first_line_pattern = '^sc\.(true|false)\b'

line_comments = ["// "]
tab_size = 4
hard_tabs = false
word_characters = [".", ":"]
autoclose_before = ";:.,=}])> \t\n"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]

decrease_indent_patterns = [
  { pattern = "^\\s*}\\s*else\\b", valid_after = ["if"] },
  { pattern = "^\\s*else\\b", valid_after = ["if"] },
]
